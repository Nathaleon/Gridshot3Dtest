<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gridshot 3D Trainer</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #171a22;
    --accent: #ff5c5c;
    --accent2: #4cc9f0;
    --text: #e8e9ee;
    --muted: #8a8f9c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
  }
  canvas#three {
    display: block;
    width: 100%;
    height: 100%;
  }

  #hud {
    position: absolute;
    top: 16px;
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 5;
  }
  .stat-box {
    background: rgba(23, 26, 34, 0.75);
    border: 1px solid #2a2e3a;
    border-radius: 10px;
    padding: 10px 16px;
    backdrop-filter: blur(4px);
    min-width: 90px;
    text-align: center;
  }
  .stat-box .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .stat-box .value {
    font-size: 22px;
    font-weight: 700;
    margin-top: 2px;
  }
  #hits .value { color: var(--accent2); }
  #misses .value { color: var(--accent); }
  #acc .value { color: #a0e8b0; }

  #crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 22px;
    height: 22px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 6;
    display: none;
  }
  #crosshair::before, #crosshair::after {
    content: "";
    position: absolute;
    background: var(--accent2);
  }
  #crosshair::before {
    left: 50%; top: 0;
    width: 2px; height: 100%;
    transform: translateX(-50%);
  }
  #crosshair::after {
    top: 50%; left: 0;
    height: 2px; width: 100%;
    transform: translateY(-50%);
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(10, 11, 15, 0.9);
    z-index: 10;
    text-align: center;
    gap: 14px;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 0.05em;
  }
  #overlay .sub {
    color: var(--muted);
    max-width: 380px;
    line-height: 1.5;
    margin: 0 0 2px 0;
    font-size: 13px;
  }

  #menuPanel {
    background: var(--panel);
    border: 1px solid #2a2e3a;
    border-radius: 12px;
    padding: 18px 22px;
    width: 320px;
    max-height: 62vh;
    overflow-y: auto;
    text-align: left;
  }
  #menuPanel::-webkit-scrollbar { width: 8px; }
  #menuPanel::-webkit-scrollbar-thumb { background: #2a2e3a; border-radius: 8px; }

  #menuPanel .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent2);
    margin: 14px 0 8px 0;
    border-top: 1px solid #22252f;
    padding-top: 12px;
  }
  #menuPanel .section-title:first-child { margin-top: 0; border-top: none; padding-top: 0; }

  #menuPanel .row { margin-bottom: 12px; }
  #menuPanel label {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  #menuPanel input[type="range"] {
    width: 100%;
    accent-color: var(--accent2);
  }
  #menuPanel input[type="range"]:disabled { opacity: 0.35; }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text);
    margin-bottom: 10px;
    cursor: pointer;
  }
  .toggle-row input[type="checkbox"] {
    width: 34px;
    height: 18px;
    accent-color: var(--accent2);
    cursor: pointer;
  }

  .theme-switch {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
  }
  .theme-switch button {
    flex: 1;
    padding: 8px 0;
    font-size: 12px;
    font-weight: 700;
    border: 1px solid #2a2e3a;
    border-radius: 7px;
    background: #12141c;
    color: var(--muted);
    cursor: pointer;
  }
  .theme-switch button.active {
    background: var(--accent2);
    color: #06202b;
    border-color: var(--accent2);
  }

  #menuPanel .statline {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    padding: 4px 0;
  }
  #menuPanel .statline span.v { color: var(--text); font-weight: 700; }

  #startBtn, #resetBtn {
    width: 100%;
    padding: 12px 10px;
    font-size: 14px;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.03em;
  }
  #startBtn {
    background: var(--accent2);
    color: #06202b;
    margin-top: 10px;
  }
  #startBtn:hover { filter: brightness(1.1); }
  #resetBtn {
    background: var(--accent);
    color: #1a0d0d;
    margin-top: 8px;
  }
  #resetBtn:hover { filter: brightness(1.1); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="three"></canvas>

  <div id="hud">
    <div class="stat-box" id="hits">
      <div class="label">Hits</div>
      <div class="value">0</div>
    </div>
    <div class="stat-box" id="acc">
      <div class="label">Accuracy</div>
      <div class="value">100%</div>
    </div>
    <div class="stat-box" id="misses">
      <div class="label">Misses</div>
      <div class="value">0</div>
    </div>
  </div>

  <div id="crosshair"></div>

  <div id="overlay">
    <h1>GRIDSHOT 3D</h1>
    <p class="sub">Look around with your mouse and click the glowing spheres. Settings are only editable here, in the pause menu. Press Esc anytime to pause.</p>
    <div id="menuPanel">

      <div class="section-title">Aim</div>
      <div class="row">
        <label>Sensitivity <span id="sensVal">1.00</span></label>
        <input type="range" id="sens" min="0.1" max="4" step="0.05" value="1">
      </div>
      <div class="row">
        <label>Targets at once <span id="countVal">1</span></label>
        <input type="range" id="count" min="1" max="5" step="1" value="1">
      </div>

      <div class="section-title">Spawn Area</div>
      <div class="row">
        <label>Circle height radius <span id="heightRadVal">3.0</span></label>
        <input type="range" id="heightRad" min="0.5" max="4.5" step="0.1" value="3">
      </div>
      <div class="row">
        <label>Circle range radius <span id="rangeRadVal">8.0</span></label>
        <input type="range" id="rangeRad" min="1" max="11" step="0.5" value="8">
      </div>

      <label class="toggle-row">
        <span>All circles same height</span>
        <input type="checkbox" id="sameHeight">
      </label>
      <div class="row">
        <label>Fixed height <span id="fixedHeightVal">4.0</span></label>
        <input type="range" id="fixedHeight" min="0.5" max="9" step="0.1" value="4" disabled>
      </div>

      <label class="toggle-row">
        <span>All circles same range</span>
        <input type="checkbox" id="sameRange">
      </label>
      <div class="row">
        <label>Fixed range <span id="fixedRangeVal">14.0</span></label>
        <input type="range" id="fixedRange" min="3" max="25" step="0.5" value="14" disabled>
      </div>

      <div class="section-title">Arena &amp; Weapon</div>
      <div class="row">
        <label>Arena theme</label>
        <div class="theme-switch">
          <button type="button" id="themeDarkBtn" class="active">Dark</button>
          <button type="button" id="themeLightBtn">Light</button>
        </div>
      </div>
      <label class="toggle-row">
        <span>Hide weapon</span>
        <input type="checkbox" id="hideWeapon">
      </label>

      <div class="section-title">Stats</div>
      <div class="statline"><span>Hits</span><span class="v" id="menuHits">0</span></div>
      <div class="statline"><span>Misses</span><span class="v" id="menuMisses">0</span></div>
      <div class="statline"><span>Accuracy</span><span class="v" id="menuAcc">100%</span></div>
      <button id="resetBtn">Reset Counter</button>
      <button id="startBtn">Start / Resume</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  const canvas = document.getElementById('three');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const crosshairEl = document.getElementById('crosshair');

  const sensSlider = document.getElementById('sens');
  const sensVal = document.getElementById('sensVal');
  const countSlider = document.getElementById('count');
  const countVal = document.getElementById('countVal');

  const heightRadSlider = document.getElementById('heightRad');
  const heightRadVal = document.getElementById('heightRadVal');
  const rangeRadSlider = document.getElementById('rangeRad');
  const rangeRadVal = document.getElementById('rangeRadVal');

  const sameHeightBox = document.getElementById('sameHeight');
  const fixedHeightSlider = document.getElementById('fixedHeight');
  const fixedHeightVal = document.getElementById('fixedHeightVal');

  const sameRangeBox = document.getElementById('sameRange');
  const fixedRangeSlider = document.getElementById('fixedRange');
  const fixedRangeVal = document.getElementById('fixedRangeVal');

  const themeDarkBtn = document.getElementById('themeDarkBtn');
  const themeLightBtn = document.getElementById('themeLightBtn');
  const hideWeaponBox = document.getElementById('hideWeapon');

  const hitsEl = document.querySelector('#hits .value');
  const missesEl = document.querySelector('#misses .value');
  const accEl = document.querySelector('#acc .value');
  const menuHits = document.getElementById('menuHits');
  const menuMisses = document.getElementById('menuMisses');
  const menuAcc = document.getElementById('menuAcc');

  // ---------- settings state (only ever changed while paused / menu open) ----------
  let sensitivity = parseFloat(sensSlider.value);
  let targetCount = parseInt(countSlider.value, 10);
  let heightRadius = parseFloat(heightRadSlider.value);
  let rangeRadius = parseFloat(rangeRadSlider.value);
  let sameHeight = false, fixedHeight = parseFloat(fixedHeightSlider.value);
  let sameRange = false, fixedRange = parseFloat(fixedRangeSlider.value);
  let theme = 'dark';
  let weaponHidden = false;

  sensSlider.addEventListener('input', () => {
    sensitivity = parseFloat(sensSlider.value);
    sensVal.textContent = sensitivity.toFixed(2);
  });
  countSlider.addEventListener('input', () => {
    targetCount = parseInt(countSlider.value, 10);
    countVal.textContent = targetCount;
  });
  heightRadSlider.addEventListener('input', () => {
    heightRadius = parseFloat(heightRadSlider.value);
    heightRadVal.textContent = heightRadius.toFixed(1);
  });
  rangeRadSlider.addEventListener('input', () => {
    rangeRadius = parseFloat(rangeRadSlider.value);
    rangeRadVal.textContent = rangeRadius.toFixed(1);
  });
  fixedHeightSlider.addEventListener('input', () => {
    fixedHeight = parseFloat(fixedHeightSlider.value);
    fixedHeightVal.textContent = fixedHeight.toFixed(1);
  });
  fixedRangeSlider.addEventListener('input', () => {
    fixedRange = parseFloat(fixedRangeSlider.value);
    fixedRangeVal.textContent = fixedRange.toFixed(1);
  });
  sameHeightBox.addEventListener('change', () => {
    sameHeight = sameHeightBox.checked;
    fixedHeightSlider.disabled = !sameHeight;
    heightRadSlider.disabled = sameHeight;
  });
  sameRangeBox.addEventListener('change', () => {
    sameRange = sameRangeBox.checked;
    fixedRangeSlider.disabled = !sameRange;
    rangeRadSlider.disabled = sameRange;
  });
  themeDarkBtn.addEventListener('click', () => setTheme('dark'));
  themeLightBtn.addEventListener('click', () => setTheme('light'));
  hideWeaponBox.addEventListener('change', () => {
    weaponHidden = hideWeaponBox.checked;
    weaponGroup.visible = !weaponHidden;
  });

  // ---------- stats ----------
  let hits = 0, misses = 0;
  function updateStats() {
    hitsEl.textContent = hits;
    missesEl.textContent = misses;
    menuHits.textContent = hits;
    menuMisses.textContent = misses;
    const total = hits + misses;
    const accStr = total === 0 ? '100%' : Math.round((hits / total) * 100) + '%';
    accEl.textContent = accStr;
    menuAcc.textContent = accStr;
  }
  resetBtn.addEventListener('click', () => {
    hits = 0; misses = 0;
    updateStats();
  });
  updateStats();

  // ---------- audio: synthesized "clank" ----------
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playClank() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    // short filtered noise burst -> gives the "clack" transient
    const bufSize = Math.floor(audioCtx.sampleRate * 0.12);
    const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufSize, 2.5);
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.value = 2800;
    noiseFilter.Q.value = 0.9;
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.55, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
    noise.connect(noiseFilter).connect(noiseGain).connect(audioCtx.destination);
    noise.start(now);
    noise.stop(now + 0.12);

    // metallic ringing tones -> gives the satisfying "clank" body
    [1500, 2100, 3100].forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.55, now + 0.09);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.16 / (idx + 1), now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.14 + idx * 0.02);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.18);
    });

    // low thump for weight
    const thump = audioCtx.createOscillator();
    thump.type = 'sine';
    thump.frequency.setValueAtTime(180, now);
    thump.frequency.exponentialRampToValueAtTime(70, now + 0.08);
    const thumpGain = audioCtx.createGain();
    thumpGain.gain.setValueAtTime(0.35, now);
    thumpGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    thump.connect(thumpGain).connect(audioCtx.destination);
    thump.start(now);
    thump.stop(now + 0.1);
  }

  // ---------- three.js scene ----------
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 1.7, 0);
  scene.add(camera);

  const ambient = new THREE.AmbientLight(0x8899aa, 0.7);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5, 10, 5);
  scene.add(dirLight);

  const ROOM_W = 28, ROOM_H = 12, ROOM_D = 34;
  const roomGeo = new THREE.BoxGeometry(ROOM_W, ROOM_H, ROOM_D);
  const roomMat = new THREE.MeshStandardMaterial({
    color: 0x14161f,
    side: THREE.BackSide,
    roughness: 0.9,
    metalness: 0.0
  });
  const room = new THREE.Mesh(roomGeo, roomMat);
  room.position.set(0, ROOM_H / 2 - 0.2, -ROOM_D / 2 + 5);
  scene.add(room);

  const grid = new THREE.GridHelper(ROOM_W, 20, 0x2a3244, 0x1c2130);
  grid.position.set(0, -0.19, -ROOM_D / 2 + 5);
  scene.add(grid);

  function setTheme(t) {
    theme = t;
    themeDarkBtn.classList.toggle('active', t === 'dark');
    themeLightBtn.classList.toggle('active', t === 'light');
    if (t === 'dark') {
      scene.background = new THREE.Color(0x0b0d14);
      scene.fog = new THREE.Fog(0x0b0d14, 20, 45);
      roomMat.color.set(0x14161f);
      grid.material.color.set(0x2a3244);
      ambient.intensity = 0.7;
      ambient.color.set(0x8899aa);
    } else {
      scene.background = new THREE.Color(0xdfe6ee);
      scene.fog = new THREE.Fog(0xdfe6ee, 22, 48);
      roomMat.color.set(0xeef1f6);
      grid.material.color.set(0xb9c2cf);
      ambient.intensity = 1.0;
      ambient.color.set(0xffffff);
    }
  }
  setTheme('dark');

  // ---------- procedural M1 Garand-style viewmodel ----------
  const weaponGroup = new THREE.Group();
  const metalMat = new THREE.MeshStandardMaterial({ color: 0x2b2d33, roughness: 0.4, metalness: 0.7 });
  const woodMat = new THREE.MeshStandardMaterial({ color: 0x6b4326, roughness: 0.6, metalness: 0.1 });
  const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x15161a, roughness: 0.35, metalness: 0.8 });

  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.032, 1.35, 14), darkMetalMat);
  barrel.rotation.x = Math.PI / 2;
  barrel.position.set(0, 0.02, -0.95);
  weaponGroup.add(barrel);

  const handguard = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.11, 0.55), woodMat);
  handguard.position.set(0, -0.02, -0.75);
  weaponGroup.add(handguard);

  const receiver = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.15, 0.55), metalMat);
  receiver.position.set(0, 0.01, -0.25);
  weaponGroup.add(receiver);

  const stock = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.16, 0.85), woodMat);
  stock.position.set(0, -0.04, 0.35);
  stock.rotation.x = -0.05;
  weaponGroup.add(stock);

  const stockComb = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.06, 0.3), woodMat);
  stockComb.position.set(0, 0.09, 0.55);
  weaponGroup.add(stockComb);

  const frontSight = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.06, 0.02), darkMetalMat);
  frontSight.position.set(0, 0.09, -1.58);
  weaponGroup.add(frontSight);

  const rearSight = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.05, 0.03), darkMetalMat);
  rearSight.position.set(0, 0.11, -0.02);
  weaponGroup.add(rearSight);

  const triggerGuard = new THREE.Mesh(new THREE.TorusGeometry(0.055, 0.012, 8, 16, Math.PI), metalMat);
  triggerGuard.position.set(0, -0.08, -0.1);
  triggerGuard.rotation.z = Math.PI;
  weaponGroup.add(triggerGuard);

  const trigger = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.05, 0.02), darkMetalMat);
  trigger.position.set(0, -0.06, -0.1);
  weaponGroup.add(trigger);

  const clip = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.09, 0.05), metalMat);
  clip.position.set(0, -0.09, -0.28);
  weaponGroup.add(clip);

  weaponGroup.scale.set(1.15, 1.15, 1.15);
  const weaponBasePos = new THREE.Vector3(0.32, -0.32, -0.78);
  const weaponBaseRot = new THREE.Euler(0.02, -0.15, 0.03);
  weaponGroup.position.copy(weaponBasePos);
  weaponGroup.rotation.copy(weaponBaseRot);
  camera.add(weaponGroup);

  let recoil = 0; // 0..1, decays each frame, drives kick animation

  // ---------- targets ----------
  const targets = [];
  const targetGeo = new THREE.SphereGeometry(0.55, 24, 24);

  const HEIGHT_CENTER = 4.5;
  const RANGE_CENTER = 14;
  const HEIGHT_MIN = 0.5, HEIGHT_MAX = 10.5;
  const RANGE_MIN = 2, RANGE_MAX = 26;

  function randomTargetPosition() {
    const x = (Math.random() - 0.5) * (ROOM_W - 4);

    let y;
    if (sameHeight) {
      y = fixedHeight;
    } else {
      y = HEIGHT_CENTER + (Math.random() * 2 - 1) * heightRadius;
    }
    y = Math.max(HEIGHT_MIN, Math.min(HEIGHT_MAX, y));

    let dist;
    if (sameRange) {
      dist = fixedRange;
    } else {
      dist = RANGE_CENTER + (Math.random() * 2 - 1) * rangeRadius;
    }
    dist = Math.max(RANGE_MIN, Math.min(RANGE_MAX, dist));

    return new THREE.Vector3(x, y, -dist);
  }

  function makeTarget() {
    const mat = new THREE.MeshStandardMaterial({
      color: 0xff5c5c,
      emissive: 0x992222,
      emissiveIntensity: 0.6,
      roughness: 0.35,
      metalness: 0.1
    });
    const mesh = new THREE.Mesh(targetGeo, mat);
    mesh.position.copy(randomTargetPosition());
    mesh.userData.born = performance.now();
    scene.add(mesh);
    targets.push(mesh);
    return mesh;
  }

  function removeTarget(mesh) {
    scene.remove(mesh);
    mesh.material.dispose();
    const i = targets.indexOf(mesh);
    if (i !== -1) targets.splice(i, 1);
  }

  function resetTargets() {
    while (targets.length > 0) removeTarget(targets[targets.length - 1]);
    for (let i = 0; i < targetCount; i++) makeTarget();
  }

  // ---------- mouse look ----------
  let yaw = 0, pitch = 0;
  const PITCH_LIMIT = Math.PI / 2 - 0.05;

  function onMouseMove(e) {
    if (!locked) return;
    yaw -= e.movementX * sensitivity * 0.0022;
    pitch -= e.movementY * sensitivity * 0.0022;
    pitch = Math.max(-PITCH_LIMIT, Math.min(PITCH_LIMIT, pitch));
    camera.rotation.set(pitch, yaw, 0, 'YXZ');
  }

  // ---------- shooting ----------
  const raycaster = new THREE.Raycaster();
  const center = new THREE.Vector2(0, 0);

  function onShoot() {
    if (!locked) return;
    ensureAudio();
    playClank();
    recoil = 1;

    raycaster.setFromCamera(center, camera);
    const hitsList = raycaster.intersectObjects(targets);
    if (hitsList.length > 0) {
      hits++;
      removeTarget(hitsList[0].object);
      makeTarget();
    } else {
      misses++;
    }
    updateStats();
  }

  // ---------- pointer lock / pause menu control ----------
  let locked = false;

  startBtn.addEventListener('click', () => {
    ensureAudio();
    canvas.requestPointerLock();
  });

  document.addEventListener('pointerlockchange', () => {
    locked = document.pointerLockElement === canvas;
    overlay.classList.toggle('hidden', locked);
    crosshairEl.style.display = locked ? 'block' : 'none';
    if (locked) {
      resetTargets();
    }
  });

  document.addEventListener('mousemove', onMouseMove);
  document.addEventListener('mousedown', () => {
    if (locked) onShoot();
  });

  // ---------- resize ----------
  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener('resize', onResize);
  onResize();

  // ---------- render loop ----------
  function animate() {
    requestAnimationFrame(animate);
    const t = performance.now();

    targets.forEach(m => {
      const s = 1 + 0.06 * Math.sin((t - m.userData.born) / 180);
      m.scale.set(s, s, s);
    });

    // weapon idle bob + recoil kick
    recoil += (0 - recoil) * 0.22;
    const bob = Math.sin(t * 0.0022) * 0.008;
    weaponGroup.position.set(
      weaponBasePos.x,
      weaponBasePos.y + bob,
      weaponBasePos.z + recoil * 0.14
    );
    weaponGroup.rotation.set(
      weaponBaseRot.x - recoil * 0.18,
      weaponBaseRot.y,
      weaponBaseRot.z
    );

    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
